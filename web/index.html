<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Library Management System</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <header class="site-header">
    <div class="site-title"><i class="fas fa-book-open"></i> Library Management System</div>
    <div class="stats">
      <span id="totalBooks"><i class="fas fa-book"></i> Total Books: 0</span>
      <span id="availableBooks"><i class="fas fa-check-circle"></i> Available Books: 0</span>
      <span id="totalMembers"><i class="fas fa-users"></i> Total Members: 0</span>
    </div>
  </header>
  <main class="container grid">
    <aside class="panel panel-aside">
      <h3><i class="fas fa-plus-circle"></i> Add Book</h3>
      <input id="bookTitle" placeholder="Title">
      <input id="bookAuthor" placeholder="Author">
      <input id="bookIsbn" placeholder="ISBN">
      <button id="addBook" class="primary"><i class="fas fa-plus"></i> Add Book</button>

      <h3 style="margin-top:18px;"><i class="fas fa-user-plus"></i> Add Member</h3>
      <input id="memberName" placeholder="Name">
      <input id="memberId" placeholder="Member ID">
      <input id="memberEmail" placeholder="Email">
      <button id="addMember" class="primary"><i class="fas fa-plus"></i> Add Member</button>

      <h3 style="margin-top:18px;"><i class="fas fa-exchange-alt"></i> Borrow / Return</h3>
      <input id="actionIsbn" placeholder="ISBN">
      <input id="actionMemberId" placeholder="Member ID">
      <div class="action-buttons">
        <button id="borrowBtn"><i class="fas fa-hand-holding"></i> Borrow</button>
        <button id="returnBtn"><i class="fas fa-undo"></i> Return</button>
      </div>
    </aside>

    <section class="panel large">
      <div id="notify" class="notify" style="opacity:0"></div>

      <h2><i class="fas fa-book"></i> Books</h2>
      <div class="table-container">
        <table class="table">
          <thead><tr><th>Title</th><th>Author</th><th>ISBN</th><th>Status</th><th>Action</th></tr></thead>
          <tbody id="books"></tbody>
        </table>
      </div>

      <h2><i class="fas fa-users"></i> Members</h2>
      <div class="table-container">
        <table class="table">
          <thead><tr><th>Name</th><th>Member ID</th><th>Email</th><th>Action</th></tr></thead>
          <tbody id="members"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
